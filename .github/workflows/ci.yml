name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  db:
    name: Migrations + RLS coverage (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration in supabase/migrations from zero against a
      # throwaway local Postgres, then runs the pgTAP suite — the same check
      # described in §46: 100% RLS coverage on every table, enforced in CI,
      # not just at review time.
      - name: Start local Supabase (applies all migrations)
        run: supabase start

      - name: Run pgTAP suite
        run: supabase test db
